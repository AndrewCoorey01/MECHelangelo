/**:
  ros__parameters:
    # ============================================================
    # ROS INTERFACE
    # ============================================================
    # The behaviour node, teleop node, or Nav2 should publish here.
    cmd_vel_topic: "cmd_vel"


    # ============================================================
    # ROBOT GEOMETRY
    # ============================================================
    # Measure this on the real robot.
    # It is the centre-to-centre distance between the left and right wheels.
    wheel_separation_m: 0.42


    # ============================================================
    # CMD_VEL LIMITS
    # ============================================================
    # These limit incoming /cmd_vel commands before they are converted
    # into left and right ThunderBorg motor commands.

    max_linear_vel_mps: 0.15
    max_angular_vel_radps: 0.60


    # ============================================================
    # THUNDERBORG MOTOR OUTPUT SETTINGS
    # ============================================================

    # Start conservative for physical testing.
    # Increase slowly after testing on blocks and then on the floor.
    # Range: 0.0 to 1.0
    max_power: 1.0

    # Small motor commands below this value are treated as zero.
    # Increase slightly if the robot creeps when it should be stopped.
    # Decrease slightly if very slow movement feels unresponsive.
    deadband: 0.03


    # ============================================================
    # MOTOR MAPPING AND DIRECTION CORRECTION
    # ============================================================
    # PiBorg's example code commonly treats:
    #   Motor 1 = right wheel
    #   Motor 2 = left wheel
    #
    # If your wiring is opposite, set this to false.

    motor1_is_right: true

    # If forward command makes a wheel spin backward,
    # flip that wheel's invert value.

    left_motor_invert: true
    right_motor_invert: true


    # ============================================================
    # CONTROL AND SAFETY SETTINGS
    # ============================================================

    # Stop if no /cmd_vel message has been received recently.
    cmd_timeout: 0.5

    # Control loop period in seconds.
    # 0.05 = 20 Hz.
    control_period: 0.05

    # How often status is printed in seconds.
    status_period: 0.5

    # ThunderBorg hardware communication failsafe.
    # This turns motors off if motor commands stop arriving.
    enable_comms_failsafe: true

    # Shows battery level using the ThunderBorg LEDs.
    show_battery_led: true
